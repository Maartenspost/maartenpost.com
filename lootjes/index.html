<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c1f1a">
<meta property="og:title" content="De Familie Leguit Lootjestrekmachine">
<meta property="og:description" content="Kies je naam, draai aan het rad en ontdek voor wie jij een kerstcadeautje koopt.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<title>Familie Leguit Lootjestrekmachine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Eén scherm per stap: 1 wie ben jij → 2 draai → 3 je lootje (+ verlanglijstjes). Bewust één donker kerstnacht-thema. */
:root{
  --night:#0c1f1a; --night-2:#132f28; --pine:#1c4a3c; --pine-2:#24604d;
  --cranberry:#b8323f; --cranberry-2:#d9535e; --gold:#f2c46b; --gold-soft:#f7dca0;
  --snow:#f4f1ea; --snow-dim:#a9bdb4; --line:rgba(244,241,234,.13); --paper:#f6f1e6; --ink:#2b1a12;
  --f-display:"Mountains of Christmas","Georgia",serif;
  --f-body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,#17392f 0%,var(--night) 65%) fixed,var(--night);color:var(--snow);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(70px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-x:hidden}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 6px;min-height:56px}
.back{font:inherit;font-size:15px;font-weight:600;color:var(--snow-dim);background:none;border:none;padding:8px 4px;cursor:pointer}
.back:disabled{visibility:hidden}
.dots{display:flex;gap:6px;align-items:center;min-width:0}
.dots i{width:8px;height:8px;border-radius:99px;background:rgba(244,241,234,.2);transition:width .35s,background .35s}
.dots i.on{width:24px;background:var(--gold)}
.dots i.done{background:var(--gold-soft);opacity:.6}
.toplink{font:inherit;font-size:15px;font-weight:600;color:var(--gold-soft);background:none;border:none;padding:8px 4px;cursor:pointer}
.topright{display:flex;align-items:center;gap:6px}
.soundbtn{font:inherit;font-size:18px;line-height:1;width:36px;height:36px;border-radius:50%;border:1px solid rgba(242,196,107,.45);background:rgba(242,196,107,.12);color:var(--gold);cursor:pointer;display:grid;place-items:center}
.soundbtn.off{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55;border-color:var(--line);background:transparent;color:var(--snow-dim)}

.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding-top:6px;animation:in .45s cubic-bezier(.2,.8,.2,1)}
.screen.still,.screen.still *{animation:none!important}
.screen.noin{animation:none}
.hero.again .star,.hero.again .t1 .ch,.hero.again .t2,.hero.again path,.hero.again circle{animation-delay:0s!important;animation-duration:.01s,2.4s,1.6s,4s!important}
.hero.again path{stroke-dashoffset:0}
.hero.again circle{opacity:1}
/* hero */
.hero{position:relative;text-align:center;padding:4px 0 2px}
.hero .star{display:block;font-size:30px;line-height:1;color:var(--gold);text-shadow:0 0 14px var(--gold),0 0 30px rgba(242,196,107,.6);animation:starIn .9s .1s cubic-bezier(.2,1.5,.4,1) both,twinkle 2.4s 1.2s ease-in-out infinite}
@keyframes starIn{from{transform:scale(0) rotate(-180deg);opacity:0}}
@keyframes twinkle{50%{transform:scale(1.18) rotate(12deg);filter:brightness(1.35)}}
.hero .t1{font-family:var(--f-display);font-weight:700;font-size:48px;line-height:1.02;color:var(--snow);text-shadow:0 0 18px rgba(242,196,107,.28);margin-top:4px}
.hero .t1 .ch{display:inline-block;animation:drop .8s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(.25s + var(--i)*55ms)}
@keyframes drop{from{transform:translateY(-70px) rotate(-16deg) scale(.6);opacity:0}}
.hero .t2{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1.05;margin-top:2px;
  background:linear-gradient(100deg,#e2a94b 0%,#f2c46b 38%,#fff7dc 50%,#f2c46b 62%,#e2a94b 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .8s 1.05s cubic-bezier(.2,1.2,.4,1) both,shimmer 4s 2s linear infinite}
@keyframes rise{from{transform:translateY(18px) scale(.9);opacity:0;filter:blur(6px)}}
@keyframes shimmer{from{background-position:130% 0}to{background-position:-130% 0}}
.garland{display:block;width:100%;height:46px;margin-top:4px;overflow:visible}
.garland path{fill:none;stroke:#2f6b57;stroke-width:3;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:wire 1s 1.3s ease-out forwards}
@keyframes wire{to{stroke-dashoffset:0}}
.garland circle{opacity:0;animation:bulbIn .35s both,blink 1.6s ease-in-out infinite;animation-delay:calc(1.5s + var(--i)*70ms),calc(2.2s + var(--i)*190ms)}
@keyframes bulbIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.names .name{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(1.5s + var(--i)*45ms)}
.screen.again .names .name{animation-delay:calc(var(--i)*30ms)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.name .cnt3{display:block;font-size:12px;font-weight:600;color:var(--snow-dim);margin-top:2px}
.name .cnt3.ok{color:#9ff0c6}
.snowbank{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:0;pointer-events:none}
.snowbank svg{width:100%;height:100%;display:block}
/* wishlist progress */
.meter{display:flex;justify-content:center;gap:12px}
.meter span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;border:2px dashed rgba(244,241,234,.25);color:transparent;transition:all .35s}
.meter span.on{border:2px solid var(--gold);background:rgba(242,196,107,.15);color:var(--gold);animation:ping .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes ping{from{transform:scale(.4)}}
.waitlist{display:grid;gap:6px}
.waitrow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(19,47,40,.9);border:1px solid var(--line);font-size:15px}
.waitrow b{font-weight:600}.waitrow span{color:var(--snow-dim);font-size:14px}.waitrow.ok span{color:#9ff0c6}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stepnum{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;text-align:center}
h1{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;margin:0;text-align:center;text-wrap:balance;text-shadow:0 0 18px rgba(242,196,107,.3)}
h1 span{display:block;color:var(--gold);font-size:.82em;margin-top:4px}
h2{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1.05;margin:0;text-align:center;text-wrap:balance;color:var(--snow)}
.lead{margin:0;text-align:center;color:var(--snow-dim);font-size:17px;text-wrap:balance}
.banner{border:1px solid rgba(242,196,107,.45);background:rgba(18,48,41,.9);padding:10px 14px;border-radius:12px;font-size:14px;color:var(--gold-soft);text-align:center}

.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.name{font:inherit;font-size:18px;font-weight:600;color:var(--snow);background:rgba(19,47,40,.9);border:1px solid var(--line);border-radius:16px;padding:16px 10px;cursor:pointer;transition:transform .12s,border-color .2s;position:relative}
.name:hover{border-color:var(--gold)}
.name:active{transform:scale(.96)}
.name .tick{position:absolute;top:7px;right:10px;font-size:13px;color:#9ff0c6}

.btn{font:inherit;font-weight:800;font-size:20px;border:none;border-radius:18px;padding:18px 24px;cursor:pointer;width:100%;
  background:linear-gradient(180deg,var(--cranberry-2),var(--cranberry));color:#fff;box-shadow:0 6px 0 #7d1f29,0 12px 26px rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7d1f29,0 6px 12px rgba(0,0,0,.35)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#4a3009;box-shadow:0 6px 0 #9c7128,0 12px 26px rgba(0,0,0,.35)}
.btn.ghost{background:transparent;color:var(--snow);box-shadow:none;border:1px solid var(--line);font-size:17px;font-weight:600;padding:14px 18px}
.btn.pulse:not(:disabled){animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.12);box-shadow:0 6px 0 #7d1f29,0 0 0 8px rgba(217,83,94,.18),0 12px 26px rgba(0,0,0,.35)}}
.stack{display:grid;gap:12px}
.link{font:inherit;font-size:15px;color:var(--snow-dim);background:none;border:none;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;justify-self:center}
.muted{color:var(--snow-dim);font-size:14px;text-align:center;margin:0}

.wheel-box{position:relative;width:100%;max-width:min(340px,42vh);aspect-ratio:1;margin:0 auto}
#wheel{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-8px;width:34px;height:40px;margin-left:-17px;transform-origin:50% 8px;z-index:2;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(242,196,107,.55))}
.pointer::before{content:"";position:absolute;inset:0;background:var(--gold);clip-path:polygon(0 0,100% 0,50% 100%)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6dc,var(--gold) 45%,#a87a26);border:3px solid #fff3d0;display:grid;place-items:center;font-size:clamp(22px,8vw,32px);box-shadow:0 4px 18px rgba(0,0,0,.45)}
.wheel-box.dim{opacity:.45;filter:saturate(.6)}
.wheel-box.win #wheel{animation:glow 1s ease-out}
@keyframes glow{40%{filter:drop-shadow(0 0 28px rgba(242,196,107,.9))}}

.env-wrap{display:grid;place-items:center;padding-top:118px;perspective:900px}
.env{position:relative;width:min(100%,320px);aspect-ratio:1.45;animation:envIn .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes envIn{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.env-back,.env-front{position:absolute;inset:0;border-radius:10px}
.env-back{background:#8e2431}
.env-front{background:linear-gradient(160deg,#c43b48,#9c2733);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);z-index:3}
.env-front::after{content:"";position:absolute;left:50%;top:52%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2c9,var(--gold) 55%,#a87a26)}
.flap{position:absolute;left:0;right:0;top:0;height:56%;background:linear-gradient(180deg,#b3313e,#a02c38);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;z-index:4;animation:flap .55s .55s ease-in forwards}
@keyframes flap{to{transform:rotateX(180deg);z-index:1}}
.letter{position:absolute;left:7%;right:7%;top:8%;bottom:6%;background:var(--paper);color:var(--ink);border-radius:6px;z-index:2;text-align:center;padding:14px 10px;display:flex;flex-direction:column;justify-content:center;gap:4px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);animation:letter .8s 1.05s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes letter{to{transform:translateY(-54%);z-index:5}}
.letter small{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cranberry);font-weight:800}
.letter b{font-family:var(--f-display);font-size:clamp(38px,12vw,52px);line-height:1;color:var(--pine)}
.after{opacity:0;animation:fadeup .5s 1.9s ease-out forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:rgba(19,47,40,.9);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--gold);color:#4a3009;font-weight:800}
.tag.red{background:var(--cranberry);color:#fff}
.items{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(244,241,234,.05);border:1px solid var(--line)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--snow-dim);display:flex;flex-wrap:wrap;gap:10px}
.item a{color:var(--gold-soft)}
.item.claimed .t{text-decoration:line-through;text-decoration-color:var(--cranberry-2);opacity:.7}
.mini{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--snow);padding:7px 11px;border-radius:99px;cursor:pointer;white-space:nowrap}
.mini.on{background:var(--pine-2);border-color:#8fe3b6}
.empty{color:var(--snow-dim);font-size:15px;margin:0}
form.add{display:grid;gap:8px;margin-top:12px}
form.add .row2{display:grid;grid-template-columns:1fr 90px;gap:8px}
input{font:inherit;font-size:16px;background:var(--night);color:var(--snow);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}
input::placeholder{color:#7f948a}
form.add .btn{font-size:17px;padding:13px}
details.card summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"›";margin-left:auto;font-size:22px;color:var(--snow-dim);transition:transform .2s}
details.card[open] summary::after{transform:rotate(90deg)}
details.card[open] summary{margin-bottom:10px}
.cnt{font-size:13px;color:var(--snow-dim);font-weight:400}

.org{border:1px dashed rgba(242,196,107,.55);border-radius:18px;padding:16px;display:grid;gap:10px;background:rgba(12,31,26,.7)}
.org .k{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800;text-align:center}
.progress{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--snow-dim)}
.pill.done{border-color:rgba(143,227,182,.5);color:#bff0d4}
footer{text-align:center;color:var(--snow-dim);font-size:13px;padding-top:22px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.hero *,.names .name,.garland *,.meter span,.screen,.env,.flap,.letter,.after,.btn.pulse{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="snowbank" aria-hidden="true"><svg viewBox="0 0 400 70" preserveAspectRatio="none"><defs><linearGradient id="sb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe0e6"/></linearGradient></defs>
<path d="M0 44 C40 22 70 30 105 38 C140 46 160 18 205 22 C250 26 270 44 310 36 C345 29 370 20 400 30 L400 70 L0 70Z" fill="url(#sb)" opacity=".92"/>
<path d="M0 56 C50 44 90 52 140 50 C190 48 230 58 280 52 C330 46 370 54 400 50 L400 70 L0 70Z" fill="#e6f0f2"/></svg></div>
<div class="app">
  <div class="top">
    <button class="back" id="back" type="button">‹ Terug</button>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="topright"><button class="soundbtn" id="sound" type="button" aria-label="Muziek en geluid uitzetten">♪</button><button class="toplink" id="toLists" type="button">Lijstjes</button></div>
  </div>
  <div id="banner" class="banner" hidden></div>
  <div id="heroSlot"></div>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>

<script>
(function(){
"use strict";
const PEOPLE=[{id:"janwillem",name:"Jan Willem"},{id:"gabrielle",name:"Gabrielle"},{id:"willemijn",name:"Willemijn"},{id:"maarten",name:"Maarten"},{id:"jesse",name:"Jesse"},{id:"antoinette",name:"Antoinette"},{id:"sara",name:"Sara"},{id:"nine",name:"Nine"},{id:"jelle",name:"Jelle"},{id:"janica",name:"Janica"}];
const byId=Object.fromEntries(PEOPLE.map(p=>[p.id,p]));
const SEG=["#b8323f","#1c4a3c","#d9a441","#24604d","#8e2431","#2f6b57","#c2803a","#1a3f34","#a62b38","#3a7a63"];
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=s=>document.querySelector(s);
const el=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const k in props){if(k==="class")e.className=props[k];else if(k==="text")e.textContent=props[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),props[k]);else e.setAttribute(k,props[k]);}for(const c of kids)if(c!=null)e.append(c);return e;};

const S={screen:"who",me:null,mine:null,lists:{},claims:{},draws:{},owner:false,confirmReset:false,busy:false,spinning:false,F:null,focusList:null};

/* ---------- lootjes ---------- */
function derangement(ids){
  const rnd=n=>{const a=new Uint32Array(1);const lim=Math.floor(0x100000000/n)*n;let x;do{crypto.getRandomValues(a);x=a[0];}while(x>=lim);return x%n;};
  let a; do{a=[...ids];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}}while(a.some((x,i)=>x===ids[i]));
  return Object.fromEntries(ids.map((id,i)=>[id,a[i]]));
}
const seal=(g,r)=>btoa(unescape(encodeURIComponent(g+"|"+r))).split("").reverse().join("");
const unseal=(g,code)=>{try{const t=decodeURIComponent(escape(atob(String(code).split("").reverse().join(""))));const [a,b]=t.split("|");return a===g&&byId[b]?b:null;}catch(e){return null;}};
const IDS=PEOPLE.map(p=>p.id);
const hasDrawn=id=>!!(S.draws[id]&&S.draws[id].wrapped);
const MIN=3;
const wishCount=id=>(S.lists[id]&&Array.isArray(S.lists[id].items))?S.lists[id].items.length:0;
const allReady=()=>IDS.every(id=>wishCount(id)>=MIN);
const myTarget=()=>S.me&&hasDrawn(S.me)?unseal(S.me,S.draws[S.me].wrapped):null;
/* Kies een lootje uit de pot. Nooit jezelf, en nooit zo dat de laatste persoon alleen zichzelf overhoudt. */
function choose(me,draws){
  const taken=new Set(), drawn=new Set();
  for(const g of IDS){ const d=draws[g]; if(d&&d.wrapped){ drawn.add(g); const r=unseal(g,d.wrapped); if(r) taken.add(r); } }
  const pool=IDS.filter(r=>r!==me&&!taken.has(r));
  const rest=IDS.filter(g=>g!==me&&!drawn.has(g));
  if(rest.length===1&&pool.includes(rest[0])) return rest[0];
  const a=new Uint32Array(1); crypto.getRandomValues(a); return pool[a[0]%pool.length];
}

/* ---------- opslag ---------- */
let store=null;
function makeLocalStore(){
  const key="leguit-local-v3"; let d={}; try{d=JSON.parse(localStorage.getItem(key))||{};}catch(e){}
  for(const k of ["lijstjes","geclaimd","deelnemers"]) d[k] ||= {};
  const fire=()=>{S.lists=d.lijstjes;S.claims=d.geclaimd;S.draws=d.deelnemers;soft();};
  const save=()=>{try{localStorage.setItem(key,JSON.stringify(d));}catch(e){}fire();return Promise.resolve();};
  setTimeout(fire,0);
  return {saveList:(id,items)=>{d.lijstjes[id]={items};return save();},
    claim:(id,itemId,who)=>{d.geclaimd[id] ||= {claims:{}};d.geclaimd[id].claims[itemId]=who;return save();},
    draw:async me=>{ if(d.deelnemers[me]&&d.deelnemers[me].wrapped) return unseal(me,d.deelnemers[me].wrapped);
      const r=choose(me,d.deelnemers); d.deelnemers[me]={wrapped:seal(me,r),at:Date.now()}; try{localStorage.setItem(key,JSON.stringify(d));}catch(e){} return r; },
    flush:()=>{fire();},
    reset:()=>{d.deelnemers={};return save();}};
}
function makeFirebaseStore(F){
  const {db,fs}=F; let answered=false;
  const timer=setTimeout(()=>{if(!answered)showBanner("Even geduld… de gegevens worden nog geladen. Controleer anders je internet.");},10000);
  const ok=()=>{if(!answered){answered=true;clearTimeout(timer);hideBanner();}};
  const fail=()=>{ok();showBanner("Er ging iets mis met laden. Probeer het over een paar minuten opnieuw.");};
  const toMap=s=>Object.fromEntries(s.docs.map(x=>[x.id,x.data()]));
  const col=n=>fs.collection(db,n),docr=(n,id)=>fs.doc(db,n,id);
  fs.onSnapshot(col("lijstjes"),s=>{if(!s.metadata.fromCache)ok();S.lists=toMap(s);soft();},fail);
  fs.onSnapshot(col("geclaimd"),s=>{S.claims=toMap(s);soft();},fail);
  fs.onSnapshot(col("deelnemers"),s=>{S.draws=toMap(s);soft();},fail);
  const guard=p=>p.catch(e=>{showBanner(e&&e.code==="permission-denied"?"Dat mag helaas niet.":"Opslaan lukte niet. Controleer je internet en probeer het nog eens.");throw e;});
  return {saveList:(id,items)=>guard(fs.setDoc(docr("lijstjes",id),{items})),
    claim:(id,itemId,who)=>guard(fs.setDoc(docr("geclaimd",id),{claims:{[itemId]:who}},{merge:true})),
    /* trekken in een transactie: twee mensen tegelijk kunnen nooit dezelfde naam krijgen */
    draw:me=>guard(fs.runTransaction(db,async tx=>{
      const snaps=await Promise.all(IDS.map(id=>tx.get(docr("deelnemers",id))));
      const draws={}; snaps.forEach((sn,i)=>{ if(sn.exists()) draws[IDS[i]]=sn.data(); });
      if(draws[me]&&draws[me].wrapped) return unseal(me,draws[me].wrapped);
      const r=choose(me,draws);
      tx.set(docr("deelnemers",me),{wrapped:seal(me,r),at:Date.now()});
      return r;
    })),
    flush:()=>{},
    reset:async()=>{for(const id of IDS) if(S.draws[id]) await guard(fs.deleteDoc(docr("deelnemers",id)));}};
}

function makeWheel(cv){
  const ctx=cv.getContext("2d"); let W=0,dpr=1,raf=0; const NAMES=S.wheelNames||PEOPLE, N=NAMES.length, A=Math.PI*2/N;
  const size=()=>{dpr=Math.min(devicePixelRatio||1,2);W=cv.getBoundingClientRect().width;cv.width=Math.max(1,W*dpr);cv.height=Math.max(1,W*dpr);};
  size();
  const draw=t=>{
    if(!cv.isConnected){cancelAnimationFrame(raf);return;}
    if(W<60){size();if(W<60){raf=requestAnimationFrame(draw);return;}}
    const c=W/2,R=W/2-3,inner=R-16; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,W);
    ctx.beginPath();ctx.arc(c,c,R,0,7);ctx.fillStyle="#6d1d26";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#f2c46b";ctx.stroke();
    for(let i=0;i<N;i++){
      const a0=wheelRot+i*A; ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,inner,a0,a0+A);ctx.closePath();const col=SEG[PEOPLE.indexOf(NAMES[i])%SEG.length]; ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle="rgba(255,243,208,.5)";ctx.lineWidth=1.2;ctx.stroke();
      const mid=a0+A/2, nm=((mid%(Math.PI*2))+Math.PI*2)%(Math.PI*2), flip=nm>Math.PI/2&&nm<Math.PI*1.5;
      ctx.save();ctx.translate(c,c);ctx.rotate(flip?mid+Math.PI:mid);ctx.textAlign=flip?"left":"right";ctx.textBaseline="middle";
      ctx.fillStyle=(col==="#d9a441"||col==="#c2803a")?"#3a2508":"#fff8e6";
      ctx.font="700 "+Math.max(11,W*0.046)+"px 'Bricolage Grotesque',system-ui,sans-serif";
      ctx.fillText(NAMES[i].name,flip?-(inner-10):inner-10,0);ctx.restore();
    }
    const L=24, sp=S.spinning?14:2;
    for(let i=0;i<L;i++){const a=i/L*Math.PI*2,x=c+Math.cos(a)*(R-8),y=c+Math.sin(a)*(R-8);
      const on=reduced||Math.sin(t/1000*sp*Math.PI+i*(S.spinning?1:2.1))>-.1, col=["#ffe3a0","#ff8b93","#9ff0c6"][i%3];
      ctx.beginPath();ctx.arc(x,y,on?3.8:3,0,7);if(on){ctx.shadowColor=col;ctx.shadowBlur=10;ctx.fillStyle=col;}else{ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,.16)";}ctx.fill();ctx.shadowBlur=0;}
    raf=requestAnimationFrame(draw);
  };
  raf=requestAnimationFrame(draw);
  return {size};
}

let audio=null, master=null, sfx=null, musicBus=null, verb=null;
let soundOn=true; try{ soundOn=localStorage.getItem("leguit-geluid")!=="uit"; }catch(e){}
function ac(){
  try{
    if(!audio){
      audio=new (window.AudioContext||window.webkitAudioContext)();
      master=audio.createGain(); master.gain.value=soundOn?1:0; master.connect(audio.destination);
      // zachte galm: kunstmatige impulsrespons van uitstervende ruis
      verb=audio.createConvolver(); const len=audio.sampleRate*2.6, ir=audio.createBuffer(2,len,audio.sampleRate);
      for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
      verb.buffer=ir; const vg=audio.createGain(); vg.gain.value=.55; verb.connect(vg).connect(master);
      sfx=audio.createGain(); sfx.gain.value=.9; sfx.connect(master); const ss=audio.createGain(); ss.gain.value=.35; sfx.connect(ss).connect(verb);
      musicBus=audio.createGain(); musicBus.gain.value=.0001; const lp=audio.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3200;
      musicBus.connect(lp); lp.connect(master); const ms=audio.createGain(); ms.gain.value=.8; lp.connect(ms).connect(verb);
    }
    if(audio.state==="suspended") audio.resume();
  }catch(e){}
  return audio;
}
function setSound(on){
  soundOn=on; try{localStorage.setItem("leguit-geluid",on?"aan":"uit");}catch(e){}
  if(audio){ master.gain.setTargetAtTime(on?1:0,audio.currentTime,.15); }
  if(on){ ac(); startMusic(); }

}
function renderSoundBtn(){ const b=$("#sound"); if(!b) return; b.textContent="♪"; b.setAttribute("aria-label",soundOn?"Muziek en geluid uitzetten":"Muziek en geluid aanzetten"); b.classList.toggle("off",!soundOn); }
/* speeldoos-toon: grondtoon + boventonen die snel uitsterven */
function bell(f,t,vol,dest,dur){
  const a=audio; const g=a.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||1.6)); g.connect(dest);
  [[1,1],[2.01,.35],[3.98,.12],[5.4,.05]].forEach(([m,v])=>{const o=a.createOscillator(),og=a.createGain();o.type="sine";o.frequency.value=f*m;og.gain.value=v;o.connect(og).connect(g);o.start(t);o.stop(t+(dur||1.6)+.05);});
}
function pad(freqs,t,dur,vol){
  const a=audio; const g=a.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+dur*.35); g.gain.linearRampToValueAtTime(.0001,t+dur+.6); g.connect(musicBus);
  freqs.forEach(f=>{[-4,4].forEach(dt=>{const o=a.createOscillator();o.type="triangle";o.frequency.value=f;o.detune.value=dt;o.connect(g);o.start(t);o.stop(t+dur+.7);});});
}
function tick(){ if(!soundOn) return; const a=ac(); if(!a) return; try{ bell(1900+Math.random()*250,a.currentTime,.035,sfx,.12); }catch(e){} }
function chime(){ if(!soundOn) return; const a=ac(); if(!a) return; try{ duck(); [784,988,1175,1568,1976].forEach((f,i)=>bell(f,a.currentTime+i*.12,.08,sfx,2.2)); }catch(e){} }
/* sleebelletjes bij het kiezen van een naam */
function jingle(){ if(!soundOn) return; const a=ac(); if(!a) return; try{
  for(let k=0;k<7;k++){ const t=a.currentTime+k*.045+Math.random()*.02;
    const n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*.06,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
    n.buffer=b; const hp=a.createBiquadFilter(); hp.type="bandpass"; hp.frequency.value=6500+Math.random()*2500; hp.Q.value=6; const g=a.createGain(); g.gain.value=.22; n.connect(hp).connect(g).connect(sfx); n.start(t);
    bell(2600+Math.random()*900,t,.018,sfx,.35); }
}catch(e){} }
function pling(){ if(!soundOn) return; const a=ac(); if(!a) return; try{ bell(1047,a.currentTime,.06,sfx,1.2); bell(1568,a.currentTime+.09,.05,sfx,1.4); }catch(e){} }
function plonk(){ if(!soundOn) return; const a=ac(); if(!a) return; try{ bell(392,a.currentTime,.05,sfx,.6); }catch(e){} }
function sparkle(){ if(!soundOn) return; const a=ac(); if(!a) return; try{ [2093,2637,3136].forEach((f,i)=>bell(f,a.currentTime+i*.05,.012,sfx,.6)); }catch(e){} }
function duck(){ if(!audio||!musicBus) return; const t=audio.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setTargetAtTime(.25,t,.2); musicBus.gain.setTargetAtTime(1,t+3,1.2); }

/* "Stille Nacht" (Franz Gruber, 1818, publiek domein) als rustige speeldoos.
   Noten in achtsten (6/8). Elke frase heeft een begeleidend akkoord. */
const NOTE={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,C6:1046.5,D6:1174.66,E6:1318.51,F6:1396.91};
const SONG=[
 ["C",[["G5",3],["A5",1],["G5",2],["E5",6]]],["C",[["G5",3],["A5",1],["G5",2],["E5",6]]],
 ["G",[["D6",4],["D6",2],["B5",6]]],["C",[["C6",4],["C6",2],["G5",6]]],
 ["F",[["A5",4],["A5",2],["C6",3],["B5",1],["A5",2]]],["C",[["G5",3],["A5",1],["G5",2],["E5",6]]],
 ["F",[["A5",4],["A5",2],["C6",3],["B5",1],["A5",2]]],["C",[["G5",3],["A5",1],["G5",2],["E5",6]]],
 ["G",[["D6",4],["D6",2],["F6",3],["D6",1],["B5",2]]],["C",[["C6",6],["E6",6]]],
 ["C",[["C6",3],["G5",1],["E5",2]]],["G",[["G5",3],["F5",1],["D5",2]]],["C",[["C5",12]]]
];
const CHORD={C:["C4","E4","G4"],G:["D4","G4","B4"],F:["C4","F4","A4"]};
let musicOn=false, musicTimer=0;
function startMusic(){
  if(musicOn||!soundOn) return; const a=ac(); if(!a) return; musicOn=true;
  musicBus.gain.cancelScheduledValues(a.currentTime); musicBus.gain.setTargetAtTime(1,a.currentTime,1.5);
  const E=.36; // seconden per achtste: heel rustig
  const play=()=>{
    if(!soundOn){ musicOn=false; return; }
    let t=audio.currentTime+.15;
    for(const [ch,notes] of SONG){
      const len=notes.reduce((n,[,d])=>n+d,0)*E;
      pad(CHORD[ch].map(n=>NOTE[n]/2),t,len,.018);
      let tt=t; for(const [n,d] of notes){ bell(NOTE[n]/2,tt,.045,musicBus,Math.max(1.4,d*E*1.6)); tt+=d*E; }
      t+=len;
    }
    const total=t-audio.currentTime;
    musicTimer=setTimeout(play,(total+4)*1000);
  };
  play();
}

function spin(target){
  if(S.spinning) return;
  const NAMES=S.wheelNames||PEOPLE, idx=NAMES.findIndex(p=>p.id===target), A=Math.PI*2/NAMES.length, TAU=Math.PI*2; if(idx<0) return;
  ac(); S.spinning=true; renderChrome();
  const start=wheelRot; let end=-Math.PI/2-(idx+.5)*A+(Math.random()-.5)*A*.55; while(end<start+TAU*7) end+=TAU;
  const dur=reduced?700:6000, t0=performance.now(), ptr=$("#pointer"); let last=-1;
  const ease=k=>1-Math.pow(1-k,4);
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur); wheelRot=start+(end-start)*ease(k);
    const sIdx=Math.floor(((-Math.PI/2-wheelRot)%TAU+TAU)%TAU/A);
    if(sIdx!==last){last=sIdx;if(!reduced){tick();ptr&&ptr.animate([{transform:"rotate(-24deg)"},{transform:"rotate(0)"}],{duration:Math.min(260,90+k*260),easing:"cubic-bezier(.3,1.6,.5,1)"});}}
    if(k<1) requestAnimationFrame(step);
    else{
      wheelRot=end%TAU; chime(); burst(); const b=$(".wheel-box"); b&&b.classList.add("win");
      S.mine=target;
      setTimeout(()=>{S.spinning=false;store.flush();go("reveal");},reduced?200:1000);
    }
  };
  requestAnimationFrame(step);
}

/* ---------- stap 3: je lootje ---------- */
function revealScreen(s){
  const t=S.mine; if(!t){queueMicrotask(()=>go(S.me?"spin":"who"));return;}
  const nm=byId[t].name;
  s.append(el("div",{class:"stepnum"},"Stap 4 · Jouw lootje"));
  s.append(el("div",{class:"env-wrap"},el("div",{class:"env"},
    el("div",{class:"env-back"}),
    el("div",{class:"letter"},el("small",{},"Jij koopt een cadeau voor"),el("b",{id:"lootje-naam"},nm)),
    el("div",{class:"env-front"}),el("div",{class:"flap"}))));
  s.append(el("div",{class:"stack after"},
    el("p",{class:"lead"},"Niet verklappen! 🤫"),
    el("button",{class:"btn gold",type:"button",id:"to-wish",onclick:()=>{S.focusList=t;go("lists");}},"Wat wil "+nm+" graag?"),
    el("button",{class:"btn ghost",type:"button",onclick:()=>{S.focusList=S.me;go("lists");}},"Mijn eigen verlanglijstje invullen"),
    el("button",{class:"link",type:"button",id:"next-person",onclick:()=>{S.me=null;S.mine=null;go("who");}},"Klaar! Volgende persoon")));
  setTimeout(()=>{if(S.screen==="reveal")confetti();},reduced?0:1500);
}

/* ---------- verlanglijstjes ---------- */
function listsScreen(s){
  s.append(el("h2",{},"Verlanglijstjes"));
  const target=S.mine;
  if(S.me) s.append(listCard(S.me,true));
  else s.append(el("p",{class:"lead"},"Ga terug en kies je naam om je eigen lijstje in te vullen."));
  if(target) s.append(listCard(target,false));
  const others=PEOPLE.filter(p=>p.id!==S.me&&p.id!==target);
  s.append(el("div",{class:"stepnum",style:"margin-top:6px"},"Alle anderen"));
  for(const p of others) s.append(listCard(p.id,false,true));
  if(S.focusList){const id=S.focusList;S.focusList=null;setTimeout(()=>{const e=document.getElementById("list-"+id);e&&e.scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"});},60);}
}
function listCard(id,mine,collapsible){
  const p=byId[id], items=(S.lists[id]&&Array.isArray(S.lists[id].items))?S.lists[id].items:[], claims=(S.claims[id]&&S.claims[id].claims)||{};
  const head=[el("span",{},p.name), mine?el("span",{class:"tag"},"Jij"):null, id===S.mine?el("span",{class:"tag red"},"Jouw lootje"):null];
  const body=[];
  if(!items.length) body.push(el("p",{class:"empty"},mine?"Nog leeg. Wat wil jij graag hebben?":p.name+" heeft nog niets op het lijstje gezet."));
  else{
    const ul=el("ul",{class:"items"});
    for(const it of items){
      const by=!mine?(claims[it.id]||null):null, li=el("li",{class:"item"+(by?" claimed":"")}), meta=el("div",{class:"meta"});
      if(it.prijs) meta.append(el("span",{},"± € "+it.prijs));
      if(it.link&&/^https?:\/\//i.test(it.link)) meta.append(el("a",{href:it.link,target:"_blank",rel:"noopener noreferrer"},"Bekijk"));
      if(by) meta.append(el("span",{},"🎁 "+(by===S.me?"Jij koopt dit":(byId[by]?.name||"Iemand")+" koopt dit")));
      li.append(el("div",{class:"body"},el("div",{class:"t"},it.tekst),meta));
      if(mine) li.append(el("button",{class:"mini",type:"button",onclick:()=>{plonk();store.saveList(id,items.filter(x=>x.id!==it.id)).catch(()=>{});}},"Weg"));
      else if(S.me&&(!by||by===S.me)) li.append(el("button",{class:"mini"+(by?" on":""),type:"button",onclick:()=>store.claim(id,it.id,by?null:S.me).catch(()=>{})},by?"Toch niet":"Ik koop dit"));
      ul.append(li);
    }
    body.push(ul);
  }
  if(mine){
    const f=el("form",{class:"add",autocomplete:"off"},
      el("input",{id:"add-tekst",placeholder:"Wat wil je graag?",required:"",maxlength:"140","aria-label":"Wens"}),
      el("div",{class:"row2"},el("input",{id:"add-link",placeholder:"Link (mag leeg)",inputmode:"url","aria-label":"Link"}),el("input",{id:"add-prijs",placeholder:"€",inputmode:"decimal",maxlength:"8","aria-label":"Prijs"})),
      el("button",{class:"btn",type:"submit"},"+ Toevoegen"));
    f.addEventListener("submit",ev=>{ev.preventDefault();const t=$("#add-tekst").value.trim();if(!t)return;
      let link=$("#add-link").value.trim(); if(link&&!/^https?:\/\//i.test(link)) link="https://"+link;
      const prijs=$("#add-prijs").value.trim().replace(/[^\d.,]/g,"");
      const next=[...items,{id:Math.random().toString(36).slice(2,10),tekst:t.slice(0,140),link:link.slice(0,500),prijs}];
      ["#add-tekst","#add-link","#add-prijs"].forEach(q=>$(q).value="");
      pling(); store.saveList(id,next).then(()=>{render();const i=$("#add-tekst");i&&i.focus();}).catch(()=>{});});
    body.push(f);
  }
  if(collapsible) return el("details",{class:"card",id:"list-"+id},el("summary",{},...head,el("span",{class:"cnt"},items.length?"· "+items.length+(items.length===1?" wens":" wensen"):"· leeg")),...body);
  return el("div",{class:"card",id:"list-"+id},el("h3",{},...head),...body);
}

/* ---------- sneeuw & confetti ---------- */
const sc=$("#snow"),sx=sc.getContext("2d"); let flakes=[],sparks=[];
function sizeSnow(){const r=Math.min(devicePixelRatio||1,2);sc.width=innerWidth*r;sc.height=innerHeight*r;sx.setTransform(r,0,0,r,0,0);
  const n=Math.round(Math.min(260,innerWidth*innerHeight/4200));
  flakes=Array.from({length:n},()=>{const z=Math.random();return {x:Math.random()*innerWidth,y:Math.random()*innerHeight,z,r:.6+z*z*3.4,s:.25+z*1.1,d:Math.random()*6,w:.2+Math.random()*.6};});
  stars=Array.from({length:Math.round(innerWidth/9)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight*.45,r:Math.random()*1.1+.3,p:Math.random()*6}));}
let stars=[];
function burst(){if(reduced)return;const b=$(".wheel-box");if(!b)return;const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2,v=Math.random()*7+2;sparks.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:1,c:["#f2c46b","#d9535e","#9ff0c6","#fff"][i%4],w:4,h:4});}}
function confetti(){if(reduced)return;for(let i=0;i<120;i++){sparks.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:Math.random()*2+2,life:1.6,c:["#f2c46b","#d9535e","#9ff0c6","#fff","#b8323f"][i%5],w:6,h:10,rot:Math.random()*6});}}
function loop(t){sx.clearRect(0,0,innerWidth,innerHeight);sx.fillStyle="#fff";
  for(const st of stars){sx.globalAlpha=reduced?.5:.25+.5*(.5+.5*Math.sin(t/700+st.p));sx.beginPath();sx.arc(st.x,st.y,st.r,0,7);sx.fill();}
  const wind=Math.sin(t/5200)*.6+Math.sin(t/1900)*.25;
  for(const f of flakes){if(!reduced){f.y+=f.s;f.x+=Math.sin(t/1500+f.d)*f.w+wind*f.z;if(f.y>innerHeight+6){f.y=-6;f.x=Math.random()*innerWidth;}if(f.x>innerWidth+6)f.x=-6;if(f.x<-6)f.x=innerWidth+6;}
    sx.globalAlpha=.25+f.z*.7;sx.beginPath();sx.arc(f.x,f.y,f.r,0,7);sx.fill();}
  sparks=sparks.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of sparks){p.x+=p.vx;p.y+=p.vy;p.vy+=p.w>4?.04:.15;p.life-=p.w>4?.006:.014;sx.globalAlpha=Math.max(0,Math.min(1,p.life));sx.fillStyle=p.c;
    if(p.w>4){p.rot+=.08;sx.save();sx.translate(p.x,p.y);sx.rotate(p.rot);sx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.rot)));sx.restore();}else sx.fillRect(p.x,p.y,4,4);}
  sx.globalAlpha=1;requestAnimationFrame(loop);}
sizeSnow();requestAnimationFrame(loop);

/* ---------- start ---------- */
renderSoundBtn();
render();
window.leguitStart=function(F){
  if(F){S.F=F;store=makeFirebaseStore(F);
    F.onUser(u=>{S.owner=!!(u&&u.email&&F.admins.includes(u.email.toLowerCase()));if(u&&!S.owner)showBanner("Je bent ingelogd met "+u.email+", maar dat is geen organisator-account.");render();});
  }else{store=makeLocalStore();S.owner=true;showBanner("Proefmodus: nog niet gekoppeld aan de online opslag. Alles blijft op dit apparaat.");render();}
};
})();
